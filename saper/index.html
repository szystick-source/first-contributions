<script>
/* iOS w apce z ekranu głównego potrafi przy starcie policzyć wysokość okna bez
   górnego paska (godzina, Dynamic Island) i poprawia ją dopiero po pierwszym
   przesunięciu palcem. Do tego czasu wszystko przypięte do dołu wisi za wysoko,
   a pod spodem zostaje pusty pas. --lag to brakująca różnica: o tyle zsuwamy
   pasek zakładek, tło i panele. Gdy iOS sam się poprawi, wraca do zera. */
(function () {
  var root = document.documentElement;
  function fit() {
    var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    var lag = standalone && innerHeight > innerWidth ? screen.height - root.clientHeight : 0;
    root.style.setProperty('--lag', (lag > 0 && lag < 100 ? lag : 0) + 'px');
  }
  fit();
  ['resize', 'scroll', 'orientationchange', 'pageshow'].forEach(function (type) {
    addEventListener(type, fit, { passive: true });
  });
  document.addEventListener('visibilitychange', fit);
})();
</script>
